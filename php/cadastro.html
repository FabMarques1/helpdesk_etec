<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#140d36">
        <title>Cadastro | Help Desk</title>
        <link rel="icon" href="../assets/icon/favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="../assets/css/tailwind.css">
        <link rel="stylesheet" href="../assets/css/style.css">
        <script src="script.js" defer></script>
    </head>
    <body class="min-h-screen flex items-center justify-center p-5 sm:p-8">
        <div class="background" aria-hidden="true">
            <div class="arc arc-top"></div>
            <div class="arc arc-bottom"></div>
        </div>

        <main class="login-card register-card relative grid w-full items-center overflow-hidden">
            <section class="form-panel relative z-10">
                <header class="brand flex items-center gap-4">
                    <svg class="brand-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                        <path d="M5 17v-3a11 11 0 0 1 22 0v3M25 23c0 4-3 6-8 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
                        <rect x="2" y="14" width="7" height="10" rx="3.5" fill="currentColor"/>
                        <rect x="23" y="14" width="7" height="10" rx="3.5" fill="currentColor"/>
                        <rect x="13" y="26" width="7" height="4" rx="2" fill="currentColor"/>
                    </svg>
                    <span class="brand-divider" aria-hidden="true"></span>
                    <span>Help Desk</span>
                </header>

                <div class="heading">
                    <h1 class="font-bold">Criar conta</h1>
                    <p>Preencha seus dados para continuar</p>
                </div>

                <form id="register-form" class="flex flex-col" novalidate>
                    <div class="field">
                        <label for="first-name">Nome</label>
                        <div class="input-wrap flex items-center">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="12" cy="7" r="3.5"/>
                                <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/>
                            </svg>
                            <input id="first-name" type="text" autocomplete="given-name"
                                placeholder="Digite seu nome" required aria-describedby="first-name-error">
                        </div>
                        <p class="error" id="first-name-error"></p>
                    </div>

                    <div class="field">
                        <label for="last-name">Último nome</label>
                        <div class="input-wrap flex items-center">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="12" cy="7" r="3.5"/>
                                <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/>
                            </svg>
                            <input id="last-name" type="text" autocomplete="family-name"
                                placeholder="Digite seu último nome" required aria-describedby="last-name-error">
                        </div>
                        <p class="error" id="last-name-error"></p>
                    </div>

                    <div class="field">
                        <label for="email">E-mail institucional</label>
                        <div class="input-wrap flex items-center">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <rect x="2.5" y="4.5" width="19" height="15" rx="2"/>
                                <path d="m3 6 9 7 9-7"/>
                            </svg>
                            <input id="email" type="email" autocomplete="email"
                                placeholder="Digite seu e-mail institucional" required aria-describedby="email-error">
                        </div>
                        <p class="error" id="email-error"></p>
                    </div>

                    <div class="field">
                        <label for="password">Senha</label>
                        <div class="input-wrap flex items-center">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="11" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>
                            </svg>
                            <input id="password" type="password" autocomplete="new-password"
                                placeholder="Crie sua senha" required aria-describedby="password-error">
                            <button id="toggle-password" type="button" class="eye flex items-center justify-center"
                                aria-label="Mostrar senha" aria-pressed="false">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                    <path id="eye-slash" d="M3 3l18 18" hidden/>
                                </svg>
                            </button>
                        </div>
                        <p class="error" id="password-error"></p>
                    </div>

                    <button id="submit" class="submit flex items-center justify-center gap-3 w-full font-semibold" type="submit">
                        <span class="spinner" hidden></span>
                        <span id="submit-label">Criar conta</span>
                    </button>
                    <p id="status" role="status" aria-live="polite" class="status" hidden></p>
                </form>

                <footer class="signup text-center">
                    <p>Já tem uma conta?</p>
                    <a class="text-link" href="login.html">Entrar</a>
                </footer>
            </section>

            <div class="art-panel relative flex items-center justify-center" aria-hidden="true">
                <canvas id="laptop" width="1040" height="840"></canvas>
            </div>
        </main>

    </body>
</html>
